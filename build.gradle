plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"villagerplanter" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		enableGameTests = true
		enableClientGameTests = false
		eula = true
		clearRunDirectory = true
	}
}

// Add JUnit XML reporting to the gametest run
afterEvaluate {
	tasks.matching { it.name == 'runGameTest' }.configureEach {
		jvmArgs '-Dfabric-api.gametest.report-file=' + project.layout.buildDirectory.file('gametest-results/junit.xml').get().asFile.absolutePath
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Load companion mods in dev — exclude FallingTree (no refMap, mixins crash under Mojang mappings)
	modLocalRuntime files(fileTree(dir: 'libs', include: '*.jar', exclude: 'FallingTree*'))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}
